{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}

  {# GoatCounter: код = имя аккаунта, https://<код>.goatcounter.com #}
  {% if config.extra.goatcounter %}
    <script
      data-goatcounter="https://{{ config.extra.goatcounter }}.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  {% endif %}

  {# Яндекс.Метрика: код = номер счётчика #}
  {% if config.extra.metrika %}
    <script type="text/javascript">
      (function (m, e, t, r, i, k, a) {
        m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
        m[i].l = 1 * new Date();
        for (var j = 0; j < document.scripts.length; j++) {
          if (document.scripts[j].src === r) { return; }
        }
        k = e.createElement(t); a = e.getElementsByTagName(t)[0];
        k.async = 1; k.src = r; a.parentNode.insertBefore(k, a);
      })(window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");

      ym({{ config.extra.metrika }}, "init", {
        clickmap: true,
        trackLinks: true,
        accurateTrackBounce: true
      });
    </script>
    <noscript>
      <div>
        <img src="https://mc.yandex.ru/watch/{{ config.extra.metrika }}"
             style="position:absolute; left:-9999px;" alt="">
      </div>
    </noscript>
  {% endif %}
{% endblock %}
